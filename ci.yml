name: CI
on:
  push:
    branches: [main]
permissions: {}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-dir
          key: main-key-${{ github.run_id }}
          restore-keys: |
            pwn-
      - name: Check
        run: |
          echo "--- cache-dir:"; ls -la cache-dir 2>/dev/null || echo "(absent)"
          if [ -f cache-dir/marker.txt ]; then echo "RESULT=POISON_RESTORED content=$(cat cache-dir/marker.txt)"; else echo "RESULT=CLEAN_NO_MARKER"; fi
